      - text: Our Story
      - heading "Locally owned & crafted in Dubuque" [level=2] [ref=e129]:
        - text: Locally owned &
        - emphasis [ref=e130]: crafted
        - text: in Dubuque
      - paragraph [ref=e131]: Eyedeal Optical is locally owned and operated by Bob Pierce. After beginning his career with a national eyewear chain, Bob discovered the importance of local business to his community and saw an opportunity to bring superior quality, better service and lower cost to his friends and neighbors. His vision was realized in 1997 with the opening of Eyedeal Optical. He hand-picks his incredible selection of frames, and much of our lens work is finished on-site — so many pairs are truly locally crafted, with specialty work completed through partners when needed. Bob is a member of the Lions Club International and works with the local school district to provide free exams and glasses to children in need.
      - paragraph [ref=e132]: As a company, we strive to give every patient the most comprehensive eye care available, exceptional customer service, the latest in lens technology and an incredible selection of frames. We not only want our clients to look great and have superior vision, we want them to leave with the confidence and knowledge of an informed consumer.
